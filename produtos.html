<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos – Barbearia Reis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A84C;
      --gold-light: #e8c76a;
      --dark: #0D0D0D;
      --dark2: #151515;
      --dark3: #1e1e1e;
      --text: #d4c5a9;
      --white: #fff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--dark); color: var(--text); font-family: 'Barlow', sans-serif; }

    nav {
      position: fixed; top: 0; width: 100%; z-index: 999;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 60px;
      background: rgba(13,13,13,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(201,168,76,0.2);
    }
    .nav-logo { display: flex; align-items: center; gap: 14px; text-decoration: none; }
    .logo-circle { width: 48px; height: 48px; border: 2px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 900; color: var(--gold); background: rgba(201,168,76,0.08); }
    .logo-text { font-family: 'Playfair Display', serif; color: var(--white); font-size: 20px; line-height: 1.1; }
    .logo-text span { display: block; font-size: 11px; color: var(--gold); font-family: 'Barlow', sans-serif; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; }
    .nav-links { display: flex; gap: 36px; list-style: none; }
    .nav-links a { color: var(--text); text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; position: relative; transition: color .3s; }
    .nav-links a::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 1px; background: var(--gold); transition: width .3s; }
    .nav-links a:hover { color: var(--gold); }
    .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }
    .nav-links a.active { color: var(--gold); }
    .nav-cta { background: var(--gold); color: var(--dark); padding: 10px 24px; border-radius: 2px; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; transition: all .3s; }
    .nav-cta:hover { background: var(--gold-light); }

    .page-header {
      padding: 160px 60px 80px; text-align: center;
      background: linear-gradient(180deg, #0d0d0d 0%, #111100 100%);
      border-bottom: 1px solid rgba(201,168,76,0.1);
      position: relative; overflow: hidden;
    }
    .page-header::before { content: '🛒'; position: absolute; font-size: 200px; opacity: 0.04; top: 50%; left: 50%; transform: translate(-50%,-50%); }
    .page-tag { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); margin-bottom: 16px; display: block; }
    .page-title { font-family: 'Playfair Display', serif; font-size: clamp(36px, 5vw, 64px); font-weight: 900; color: var(--white); }

    /* CART WIDGET */
    .cart-widget {
      position: fixed; bottom: 30px; right: 30px; z-index: 998;
      background: var(--gold); color: var(--dark);
      border-radius: 50px; padding: 14px 22px;
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 14px; cursor: pointer;
      box-shadow: 0 8px 32px rgba(201,168,76,0.4);
      transition: all .3s;
    }
    .cart-widget:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(201,168,76,0.5); }
    .cart-count {
      background: var(--dark); color: var(--gold);
      width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 900;
    }

    /* CART PANEL */
    .cart-panel {
      position: fixed; right: -420px; top: 0; bottom: 0; width: 400px; z-index: 1000;
      background: var(--dark2);
      border-left: 1px solid rgba(201,168,76,0.2);
      padding: 30px;
      transition: right .4s cubic-bezier(.25,.46,.45,.94);
      overflow-y: auto;
    }
    .cart-panel.open { right: 0; }
    .cart-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999; }
    .cart-overlay.show { display: block; }
    .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .cart-header h3 { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--white); }
    .cart-close { background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; transition: color .3s; }
    .cart-close:hover { color: var(--gold); }
    .cart-item { display: flex; gap: 16px; padding: 16px 0; border-bottom: 1px solid rgba(201,168,76,0.1); align-items: center; }
    .cart-item-icon { font-size: 28px; min-width: 40px; text-align: center; }
    .cart-item-info { flex: 1; }
    .cart-item-name { color: var(--white); font-size: 15px; font-weight: 600; }
    .cart-item-price { color: var(--gold); font-size: 14px; margin-top: 2px; }
    .cart-item-qty { display: flex; align-items: center; gap: 10px; }
    .qty-btn { background: rgba(201,168,76,0.1); border: 1px solid rgba(201,168,76,0.2); color: var(--gold); width: 28px; height: 28px; border-radius: 2px; cursor: pointer; font-size: 16px; transition: all .2s; }
    .qty-btn:hover { background: rgba(201,168,76,0.2); }
    .qty-num { color: var(--white); font-weight: 600; min-width: 20px; text-align: center; }
    .cart-item-remove { color: rgba(201,168,76,0.4); cursor: pointer; font-size: 18px; transition: color .2s; }
    .cart-item-remove:hover { color: #e74c3c; }
    .cart-empty { text-align: center; padding: 60px 20px; color: var(--text); }
    .cart-empty-icon { font-size: 60px; margin-bottom: 16px; }
    .cart-total { padding: 24px 0; }
    .cart-total-line { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; }
    .cart-total-final { display: flex; justify-content: space-between; padding-top: 16px; border-top: 1px solid rgba(201,168,76,0.2); }
    .cart-total-final span:first-child { font-weight: 700; color: var(--white); font-size: 16px; }
    .cart-total-final span:last-child { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--gold); }
    .btn-checkout { width: 100%; padding: 16px; background: var(--gold); color: var(--dark); border: none; cursor: pointer; font-family: 'Barlow', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; border-radius: 2px; margin-top: 16px; transition: all .3s; }
    .btn-checkout:hover { background: var(--gold-light); }

    /* FILTERS */
    .filters { display: flex; gap: 12px; justify-content: center; padding: 40px 60px 0; flex-wrap: wrap; }
    .filter-btn { padding: 10px 24px; background: transparent; border: 1px solid rgba(201,168,76,0.2); color: var(--text); font-family: 'Barlow', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: all .3s; border-radius: 2px; }
    .filter-btn:hover, .filter-btn.active { background: var(--gold); border-color: var(--gold); color: var(--dark); }

    /* PRODUCTS GRID */
    .products { max-width: 1200px; margin: 0 auto; padding: 50px 60px 100px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }

    .product-card {
      background: var(--dark2);
      border: 1px solid rgba(201,168,76,0.08);
      overflow: hidden; transition: all .3s;
      opacity: 0; transform: translateY(20px);
    }
    .product-card.visible { opacity: 1; transform: none; }
    .product-card:hover { border-color: rgba(201,168,76,0.3); transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }

    .product-img {
      width: 100%; height: 200px;
      display: flex; align-items: center; justify-content: center;
      font-size: 80px;
      background: linear-gradient(135deg, #1a1a1a 0%, #222211 100%);
      position: relative;
    }
    .product-badge {
      position: absolute; top: 12px; left: 12px;
      background: var(--gold); color: var(--dark);
      font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      padding: 4px 10px; border-radius: 2px;
    }

    .product-info { padding: 24px; }
    .product-category { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
    .product-name { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--white); margin-bottom: 8px; }
    .product-desc { font-size: 13px; color: var(--text); line-height: 1.6; margin-bottom: 20px; }
    .product-footer { display: flex; align-items: center; justify-content: space-between; }
    .product-price { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--gold); font-weight: 700; }
    .btn-add {
      background: rgba(201,168,76,0.1); border: 1px solid var(--gold); color: var(--gold);
      padding: 10px 18px; cursor: pointer; font-family: 'Barlow', sans-serif;
      font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      transition: all .3s; border-radius: 2px;
    }
    .btn-add:hover { background: var(--gold); color: var(--dark); }

    footer { background: var(--dark); border-top: 1px solid rgba(201,168,76,0.1); padding: 40px 60px; text-align: center; }
    .footer-logo { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--white); margin-bottom: 8px; }
    .footer-logo span { color: var(--gold); }
    .footer-links { display: flex; gap: 32px; justify-content: center; margin: 16px 0; }
    .footer-links a { color: var(--text); text-decoration: none; font-size: 13px; transition: color .3s; }
    .footer-links a:hover { color: var(--gold); }
    .footer-copy { color: rgba(212,197,169,0.4); font-size: 12px; margin-top: 8px; }

    @media (max-width: 768px) {
      nav { padding: 16px 24px; }
      .nav-links { display: none; }
      .page-header { padding: 120px 24px 60px; }
      .filters { padding: 30px 24px 0; }
      .products { padding: 30px 24px 80px; }
      .cart-panel { width: 100%; right: -100%; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <div class="logo-circle">R</div>
    <div class="logo-text">Barbearia Reis <span>Estilo & Tradição</span></div>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Início</a></li>
    <li><a href="agendamento.html">Agendamento</a></li>
    <li><a href="produtos.html" class="active">Produtos</a></li>
    <li><a href="contato.html">Contato</a></li>
  </ul>
  <a href="agendamento.html" class="nav-cta">Agendar Agora</a>
</nav>

<div class="page-header">
  <span class="page-tag">🛒 Nossa Loja</span>
  <h1 class="page-title">Produtos Premium</h1>
</div>

<!-- FILTROS -->
<div class="filters">
  <button class="filter-btn active" onclick="filterProducts('todos', this)">Todos</button>
  <button class="filter-btn" onclick="filterProducts('pomada', this)">Pomadas</button>
  <button class="filter-btn" onclick="filterProducts('maquina', this)">Máquinas</button>
  <button class="filter-btn" onclick="filterProducts('cuidado', this)">Cuidados</button>
</div>

<!-- PRODUTOS -->
<div class="products" id="productsGrid"></div>

<!-- CARRINHO WIDGET -->
<div class="cart-widget" onclick="openCart()">
  🛒 Carrinho
  <div class="cart-count" id="cartCount">0</div>
</div>

<!-- OVERLAY -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>

<!-- PAINEL DO CARRINHO -->
<div class="cart-panel" id="cartPanel">
  <div class="cart-header">
    <h3>🛒 Carrinho</h3>
    <button class="cart-close" onclick="closeCart()">✕</button>
  </div>
  <div id="cartItems"></div>
  <div id="cartFooter"></div>
</div>

<footer>
  <div class="footer-logo">Barbearia <span>Reis</span></div>
  <div class="footer-links">
    <a href="index.html">Início</a>
    <a href="agendamento.html">Agendamento</a>
    <a href="produtos.html">Produtos</a>
    <a href="contato.html">Contato</a>
  </div>
  <div class="footer-copy">© 2025 Barbearia Reis. Todos os direitos reservados.</div>
</footer>

<script>
  const products = [
    { id:1, name:"Pomada Modeladora Strong", category:"pomada", icon:"🏆", desc:"Fixação extra forte para estilos arrojados. Brilho intenso e duração o dia todo.", price:35, badge:"Mais Vendido" },
    { id:2, name:"Pomada Matte Effect", category:"pomada", icon:"⚫", desc:"Acabamento fosco natural. Ideal para looks modernos sem brilho.", price:32, badge:null },
    { id:3, name:"Pomada Water Based", category:"pomada", icon:"💧", desc:"Base d'água, fácil de lavar. Fixação média com brilho sutil.", price:28, badge:null },
    { id:4, name:"Cera de Argila Premium", category:"pomada", icon:"🟤", desc:"Textura de argila para volume e definição. Sem resíduo e leve fixação.", price:38, badge:"Novo" },
    { id:5, name:"Máquina Cortadora Pro X7", category:"maquina", icon:"⚡", desc:"Potência profissional, 5 pentes inclusos. Lâmina de aço inox, motor turbo.", price:189, badge:"Pro" },
    { id:6, name:"Máquina de Acabamento Zero", category:"maquina", icon:"🔋", desc:"Sem fio, bateria de longa duração. Perfeita para contorno e acabamento.", price:145, badge:null },
    { id:7, name:"Máquina Combo Corte+Barba", category:"maquina", icon:"✂", desc:"Kit completo para corte e barba. Inclui 8 pentes e estojo de couro.", price:220, badge:"Combo" },
    { id:8, name:"Óleo para Barba", category:"cuidado", icon:"🌿", desc:"Hidrata, amaicia e dá brilho à barba. Fragrância amadeirada premium.", price:42, badge:null },
    { id:9, name:"Shampoo Anticaspa", category:"cuidado", icon:"🧴", desc:"Fórmula especializada para couro cabeludo. Uso diário, sem ressecar.", price:25, badge:null },
    { id:10, name:"Balm Pós-Barba", category:"cuidado", icon:"🌸", desc:"Acalma a pele irritada após o barbear. Hidratação imediata.", price:30, badge:null },
  ];

  let cart = {};
  let currentFilter = 'todos';

  function renderProducts(filter = 'todos') {
    const grid = document.getElementById('productsGrid');
    const filtered = filter === 'todos' ? products : products.filter(p => p.category === filter);
    grid.innerHTML = '';
    filtered.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.dataset.category = p.category;
      card.innerHTML = `
        <div class="product-img">
          ${p.badge ? `<div class="product-badge">${p.badge}</div>` : ''}
          ${p.icon}
        </div>
        <div class="product-info">
          <div class="product-category">${p.category === 'pomada' ? '🏺 Pomada' : p.category === 'maquina' ? '⚡ Máquina' : '✨ Cuidado'}</div>
          <div class="product-name">${p.name}</div>
          <div class="product-desc">${p.desc}</div>
          <div class="product-footer">
            <div class="product-price">R$ ${p.price}</div>
            <button class="btn-add" onclick="addToCart(${p.id})">+ Adicionar</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
      setTimeout(() => card.classList.add('visible'), i * 80);
    });
  }

  function filterProducts(cat, btn) {
    currentFilter = cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderProducts(cat);
  }

  function addToCart(id) {
    if (!cart[id]) cart[id] = { ...products.find(p => p.id === id), qty: 0 };
    cart[id].qty++;
    updateCartCount();
    showAddedFeedback(id);
  }

  function showAddedFeedback(id) {
    const btns = document.querySelectorAll('.btn-add');
    // Simple visual feedback
    openCart();
    renderCart();
  }

  function removeFromCart(id) {
    delete cart[id];
    renderCart();
    updateCartCount();
  }

  function changeQty(id, delta) {
    cart[id].qty += delta;
    if (cart[id].qty <= 0) removeFromCart(id);
    else { renderCart(); updateCartCount(); }
  }

  function updateCartCount() {
    const total = Object.values(cart).reduce((s, i) => s + i.qty, 0);
    document.getElementById('cartCount').textContent = total;
  }

  function renderCart() {
    const items = Object.values(cart);
    const itemsEl = document.getElementById('cartItems');
    const footerEl = document.getElementById('cartFooter');

    if (items.length === 0) {
      itemsEl.innerHTML = `
        <div class="cart-empty">
          <div class="cart-empty-icon">🛒</div>
          <p>Seu carrinho está vazio.</p>
          <p style="margin-top:8px;font-size:13px;color:rgba(212,197,169,0.5)">Adicione produtos para começar!</p>
        </div>`;
      footerEl.innerHTML = '';
      return;
    }

    itemsEl.innerHTML = items.map(item => `
      <div class="cart-item">
        <div class="cart-item-icon">${item.icon}</div>
        <div class="cart-item-info">
          <div class="cart-item-name">${item.name}</div>
          <div class="cart-item-price">R$ ${item.price} cada</div>
        </div>
        <div class="cart-item-qty">
          <button class="qty-btn" onclick="changeQty(${item.id}, -1)">−</button>
          <span class="qty-num">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
        </div>
        <span class="cart-item-remove" onclick="removeFromCart(${item.id})">✕</span>
      </div>
    `).join('');

    const subtotal = items.reduce((s, i) => s + i.price * i.qty, 0);
    footerEl.innerHTML = `
      <div class="cart-total">
        <div class="cart-total-line"><span>Subtotal</span><span>R$ ${subtotal.toFixed(2)}</span></div>
        <div class="cart-total-line"><span>Entrega</span><span style="color:var(--gold)">A combinar</span></div>
        <div class="cart-total-final">
          <span>Total</span>
          <span>R$ ${subtotal.toFixed(2)}</span>
        </div>
      </div>
      <button class="btn-checkout" onclick="checkout()">Finalizar Pedido via WhatsApp</button>
    `;
  }

  function checkout() {
    const items = Object.values(cart);
    if (items.length === 0) return;
    const lista = items.map(i => `${i.qty}x ${i.name} (R$${i.price * i.qty})`).join('%0A');
    const total = items.reduce((s, i) => s + i.price * i.qty, 0);
    const msg = `Olá Barbearia Reis! Quero fazer um pedido:%0A%0A${lista}%0A%0A*Total: R$${total.toFixed(2)}*`;
    window.open(`https://wa.me/5584900000000?text=${msg}`, '_blank');
  }

  function openCart() {
    renderCart();
    document.getElementById('cartPanel').classList.add('open');
    document.getElementById('cartOverlay').classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeCart() {
    document.getElementById('cartPanel').classList.remove('open');
    document.getElementById('cartOverlay').classList.remove('show');
    document.body.style.overflow = '';
  }

  renderProducts();
</script>
</body>
</html>
